name: Sentinel Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-scan:
    name: Test and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"

          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

          gitleaks version

      - name: Install Sentinel
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest bandit pip-audit

      - name: Run tests
        run: pytest

      - name: Diagnose Bandit findings
        run: |
          bandit \
            -r . \
            --exclude ./.venv,./.git,./vulnerable_app \
            -f json \
            -o bandit-report.json || true

          python - <<'PY'
          import json

          with open("bandit-report.json") as f:
              data = json.load(f)

          findings = data.get("results", [])

          print(f"Bandit findings: {len(findings)}")
          print()

          for finding in findings:
              print(
                  f"{finding.get('issue_severity')} "
                  f"{finding.get('test_id')} "
                  f"{finding.get('filename')}:"
                  f"{finding.get('line_number')}"
              )
              print(f"  {finding.get('issue_text')}")
              print()
          PY

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --no-git \
            --report-format json \
            --report-path gitleaks-report.json || true

          if [ -s gitleaks-report.json ]; then
            cat gitleaks-report.json
          else
            echo "No Gitleaks findings."
          fi

      - name: Run pip-audit
        run: |
          if [ -f vulnerable_app/requirements.txt ]; then
            pip-audit \
              -r vulnerable_app/requirements.txt \
              -f json
          else
            echo "No vulnerable_app/requirements.txt found."
          fi

      - name: Run Sentinel security scan
        run: |
          sentinel scan . \
            --no-ai \
            --format json \
            --exclude vulnerable_app