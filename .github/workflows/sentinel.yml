name: Sentinel Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-scan:
    name: Test and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install Sentinel
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest bandit pip-audit

      - name: Run tests
        run: pytest

      - name: Run Bandit directly
        run: |
          bandit \
            -r . \
            --exclude ./.venv,./.git,./vulnerable_app \
            -f json \
            -o bandit-report.json || true

          python - <<'PY'
          import json

          with open("bandit-report.json") as f:
              data = json.load(f)

          print("=== Bandit findings ===")

          for finding in data.get("results", []):
              print(
                  f"{finding.get('issue_severity')} "
                  f"{finding.get('test_id')} "
                  f"{finding.get('filename')}:"
                  f"{finding.get('line_number')} - "
                  f"{finding.get('issue_text')}"
              )
          PY

      - name: Run Gitleaks directly
        run: |
          gitleaks detect \
            --source . \
            --no-git \
            --report-format json \
            --report-path gitleaks-report.json || true

          if [ -s gitleaks-report.json ]; then
            cat gitleaks-report.json
          else
            echo "No Gitleaks findings."
          fi

      - name: Run pip-audit directly
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt -f json || true
          elif [ -f vulnerable_app/requirements.txt ]; then
            pip-audit -r vulnerable_app/requirements.txt -f json || true
          else
            echo "No requirements.txt found."
          fi

      - name: Run Sentinel security scan
        run: sentinel scan . --no-ai --format json --exclude vulnerable_app